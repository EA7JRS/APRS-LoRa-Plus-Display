# Release: compila todas las placas, adjunta display-<placa>.zip de cada una y web-site-display.zip (instalador web).
# El instalador web es el del tracker (EA7JRS/APRS-LoRa-Plus, GitHub Pages): al publicar la release del tracker con la MISMA
# version, su workflow descarga web-site-display.zip de aqui y lo pone en display/. Etiqueta = v + DISPLAY_VERSION (p. ej. v5.4.0).
name: Release

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: "Release ya creada a la que adjuntar los ficheros (p. ej. v5.4.0)"
                required: true

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        env:
            TAG: ${{ github.event.release.tag_name || inputs.tag }}
            BOARDS: waveshare_lcd7b waveshare_lcd35 waveshare_lcd28b waveshare_lcd169
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.TAG }}
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: La etiqueta coincide con DISPLAY_VERSION
              run: |
                  V=$(sed -n 's/.*-DDISPLAY_VERSION=\\"\([^"\\]*\)\\".*/\1/p' platformio.ini)
                  echo "DISPLAY_VERSION=$V, etiqueta=$TAG"
                  test "v$V" = "$TAG" || { echo "::error::La etiqueta $TAG no es v$V"; exit 1; }
            - name: PlatformIO
              run: pip install --upgrade platformio
            - name: Compilar todas las placas con reintentos (las descargas de GitHub dan 504 a veces)
              run: |
                  for e in $BOARDS; do
                      ok=0
                      for i in 1 2 3 4 5; do
                          pio run -e $e && { ok=1; break; }
                          echo "$e: intento $i fallido"; sleep 30
                      done
                      [ $ok = 1 ] || exit 1
                  done
            - name: Ficheros del instalador web
              run: |
                  APP0=$(find ~/.platformio/packages -path '*tools/partitions/boot_app0.bin' | head -n 1)
                  for e in $BOARDS; do
                      python3 tools/make_web_assets.py board --board $e --chip esp32s3 \
                          --build-dir .pio/build/$e --boot-app0 "$APP0" --out web_site
                      rm -rf pkg && mkdir -p pkg && cp -r web_site/firmware/$e pkg/ && (cd pkg && zip -qr ../display-$e.zip .)
                  done
                  python3 tools/make_web_assets.py site --root web_site
                  (cd web_site && zip -qr ../web-site-display.zip .)
            - name: Adjuntar a la release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release upload "$TAG" display-*.zip web-site-display.zip --clobber --repo "$GITHUB_REPOSITORY"

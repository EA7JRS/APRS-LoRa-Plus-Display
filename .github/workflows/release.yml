# Release: compila, adjunta display-<placa>.zip y web-site-display.zip (ficheros del instalador web).
# El instalador web es el del tracker (EA7JRS/APRS-LoRa-Plus, GitHub Pages): al publicar la release del tracker con la MISMA
# version, su workflow descarga web-site-display.zip de aqui y lo pone en display/. Etiqueta = v + DISPLAY_VERSION (p. ej. v5.3.5).
name: Release

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: "Release ya creada a la que adjuntar los ficheros (p. ej. v5.3.5)"
                required: true

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        env:
            TAG: ${{ github.event.release.tag_name || inputs.tag }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.TAG }}
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: La etiqueta coincide con DISPLAY_VERSION
              run: |
                  V=$(sed -n 's/.*-DDISPLAY_VERSION=\\"\([^"\\]*\)\\".*/\1/p' platformio.ini)
                  echo "DISPLAY_VERSION=$V, etiqueta=$TAG"
                  test "v$V" = "$TAG" || { echo "::error::La etiqueta $TAG no es v$V"; exit 1; }
            - name: PlatformIO
              run: pip install --upgrade platformio
            - name: Compilar con reintentos (las descargas de GitHub dan 504 a veces)
              run: |
                  for i in 1 2 3 4 5; do
                      pio run -e waveshare_lcd7b && exit 0
                      echo "Intento $i fallido"; sleep 30
                  done
                  exit 1
            - name: Ficheros del instalador web
              run: |
                  B=.pio/build/waveshare_lcd7b
                  APP0=$(find ~/.platformio/packages -path '*tools/partitions/boot_app0.bin' | head -n 1)
                  python3 tools/make_web_assets.py board --board waveshare_lcd7b --chip esp32s3 \
                      --build-dir "$B" --boot-app0 "$APP0" --out web_site
                  python3 tools/make_web_assets.py site --root web_site
                  (cd web_site && zip -qr ../web-site-display.zip .)
                  mkdir -p pkg && cp -r web_site/firmware/waveshare_lcd7b pkg/ && (cd pkg && zip -qr ../display-waveshare_lcd7b.zip .)
            - name: Adjuntar a la release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release upload "$TAG" display-waveshare_lcd7b.zip web-site-display.zip --clobber --repo "$GITHUB_REPOSITORY"

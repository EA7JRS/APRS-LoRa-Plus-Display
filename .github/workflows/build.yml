name: Build

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                env: [waveshare_lcd7b, waveshare_lcd35, waveshare_lcd28b, waveshare_lcd169]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: PlatformIO
              run: pip install platformio

            - uses: actions/cache/restore@v4
              id: cache
              with:
                  path: |
                      ~/.platformio
                      .pio/libdeps
                  key: pio3-${{ hashFiles('platformio.ini') }}
                  restore-keys: pio3-

            # Las descargas de GitHub Releases dan 504 de vez en cuando: reintentar.
            - name: Compilar
              run: |
                  for i in 1 2 3 4 5; do
                      pio run -e ${{ matrix.env }} && exit 0
                      echo "Intento $i fallido, reintentando en 30 s"; sleep 30
                  done
                  exit 1

            - uses: actions/cache/save@v4
              if: success() && steps.cache.outputs.cache-hit != 'true'
              with:
                  path: |
                      ~/.platformio
                      .pio/libdeps
                  key: pio3-${{ hashFiles('platformio.ini') }}

            - name: Pruebas del protocolo (PC)
              if: matrix.env == 'waveshare_lcd7b'
              run: |
                  AJ=$(find .pio/libdeps -type d -path '*ArduinoJson/src' | head -1)
                  g++ -std=c++17 -Wall -Wextra -Werror -I src -I "$AJ" test/test_protocol.cpp src/protocol.cpp -o /tmp/test_protocol
                  /tmp/test_protocol

            - name: Tamano
              run: |
                  ls -l .pio/build/${{ matrix.env }}/firmware.bin
                  pio run -e ${{ matrix.env }} -t size | tail -8

            - uses: actions/upload-artifact@v4
              with:
                  name: aprs-lora-plus-display-${{ matrix.env }}
                  path: |
                      .pio/build/${{ matrix.env }}/firmware.bin
                      .pio/build/${{ matrix.env }}/bootloader.bin
                      .pio/build/${{ matrix.env }}/partitions.bin

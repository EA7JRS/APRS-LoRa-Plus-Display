name: Build

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            BOARDS: waveshare_lcd7b waveshare_lcd35 waveshare_lcd28b waveshare_lcd169
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: PlatformIO
              run: pip install platformio

            - uses: actions/cache/restore@v4
              id: cache
              with:
                  path: |
                      ~/.platformio
                      .pio/libdeps
                  key: pio3-${{ hashFiles('platformio.ini') }}
                  restore-keys: pio3-

            # Las descargas de GitHub Releases dan 504 de vez en cuando: reintentar.
            - name: Compilar las cuatro placas
              run: |
                  for e in $BOARDS; do
                      ok=0
                      for i in 1 2 3 4 5; do
                          pio run -e $e && { ok=1; break; }
                          echo "$e: intento $i fallido, reintentando en 30 s"; sleep 30
                      done
                      [ $ok = 1 ] || { echo "::error::$e no compila"; exit 1; }
                  done

            - uses: actions/cache/save@v4
              if: success() && steps.cache.outputs.cache-hit != 'true'
              with:
                  path: |
                      ~/.platformio
                      .pio/libdeps
                  key: pio3-${{ hashFiles('platformio.ini') }}

            - name: Pruebas del protocolo (PC)
              run: |
                  AJ=$(find .pio/libdeps -type d -path '*ArduinoJson/src' | head -1)
                  g++ -std=c++17 -Wall -Wextra -Werror -I src -I "$AJ" test/test_protocol.cpp src/protocol.cpp -o /tmp/test_protocol
                  /tmp/test_protocol

            - name: Tamano
              run: |
                  for e in $BOARDS; do
                      echo "== $e"; ls -l .pio/build/$e/firmware.bin
                      pio run -e $e -t size | grep -E "RAM:|Flash:"
                  done

            - uses: actions/upload-artifact@v4
              with:
                  name: aprs-lora-plus-display-firmware
                  path: |
                      .pio/build/*/firmware.bin
                      .pio/build/*/bootloader.bin
                      .pio/build/*/partitions.bin

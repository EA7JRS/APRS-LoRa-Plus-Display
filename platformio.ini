; APRS LoRa+ Display - pantallas tactiles Waveshare ESP32-S3 para el tracker APRS LoRa+
; Copyright (C) 2026 Manuel - EA7JRS - GPL-3.0-or-later
; Un entorno por placa (la placa se elige con -DBOARD_..., ver src/board.h):
;   waveshare_lcd7b   ESP32-S3-Touch-LCD-7B       7"    1024x600  RGB        GT911
;   waveshare_lcd7b_v2  la misma 7B con la interfaz tipo emisora de la app (src/ui7b, WiFi, caja del rotor, DX Cluster)
;   waveshare_lcd7_v2   la LCD-7 con la interfaz tipo emisora (a escala)
;   waveshare_lcd7    ESP32-S3-Touch-LCD-7        7"    800x480   RGB        GT911 (expansor CH422G)
;   waveshare_lcd35   ESP32-S3-Touch-LCD-3.5/3.5-C 3,5" 480x320   ST7796 SPI FT6336
;   waveshare_lcd28b  ESP32-S3-Touch-LCD-2.8B      2,8" 480x640   ST7701 RGB GT911
;   waveshare_lcd169  ESP32-S3-Touch-LCD-1.69      1,69" 240x280  ST7789 SPI CST816T
; Y la 7B como reloj de radioaficionado con los datos de OpenHamClock por WiFi (src/hamclock, docs/HAMCLOCK.md):
;   waveshare_lcd7b_hamclock
[platformio]
default_envs = waveshare_lcd7b

[env]
; pioarduino: Arduino-ESP32 3.x (ESP-IDF 5.x), necesario para esp_lcd RGB con bounce buffer
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
monitor_speed = 115200
; src/hamclock es otro programa (el reloj): solo entra en su entorno
build_src_filter = +<*> -<hamclock/>
lib_deps =
    lvgl/lvgl @ ~9.6.0
    h2zero/NimBLE-Arduino @ ^2.5.2
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -Isrc
    ; LVGL 9.6 sin lv_conf.h: todo por defecto salvo lo de aqui y lo de src/lv_defs.h
    -DLV_CONF_SKIP=1
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_24=1
    ; decodificadores de las teselas del mapa (interfaz tipo emisora)
    -DLV_USE_LODEPNG=1
    -DLV_USE_TJPGD=1
    -DLV_FONT_UNSCII_8=1
    -DLV_FONT_UNSCII_16=1
    -DLV_USE_QRCODE=1
    -include src/lv_defs.h
    -DLV_USE_LOG=0
    ; avisos oficiales por la WiFi (lib/aprs_links/alerts_net)
    -DAPRS_LINKS_ALERTS=1
    ; version
    -DDISPLAY_VERSION=\"5.4.4\"

; Placas con el puerto USB-C conectado al USB nativo del ESP32-S3 (el puerto serie es el USB CDC)
[usb_cdc]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:waveshare_lcd7b]
; Serial = UART0 por el CH343 (el USB nativo comparte pines con el CAN)
build_flags =
    ${env.build_flags}
    -DBOARD_LCD7B
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; reloj de pixel del panel (Hz). 30 MHz con memoria PSRAM a 120 MHz; con 80 MHz bajarlo si hay parpadeo
    -DLCD_PCLK_HZ=18000000

[env:waveshare_lcd7b_v2]
; 7B v2: la interfaz de la app Android (radio, [F], S.LIST, mensajes, SAT, rotor y CAT, DX Cluster, AIS, configuracion...)
build_flags =
    ${env:waveshare_lcd7b.build_flags}
    -DUI_RADIO

[env:waveshare_lcd7]
; ESP32-S3-Touch-LCD-7 (sin B): 800x480, expansor CH422G (la 7B lleva un CH32V003 y 1024x600: no son compatibles)
build_flags =
    ${env.build_flags}
    -DBOARD_LCD7
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLCD_PCLK_HZ=16000000

[env:waveshare_lcd7_v2]
; LCD-7 v2: la interfaz tipo emisora (src/ui7b) a escala 25/32 para 800x480
build_flags =
    ${env:waveshare_lcd7.build_flags}
    -DUI_RADIO
[env:waveshare_lcd7b_hamclock]
; Reloj con los datos de OpenHamClock (WiFi) en la 7B: placa y letras del Display, sin BLE ni protocolo del tracker
build_src_filter = +<board_common.cpp> +<board_lcd7b.cpp> +<fonts/> +<hamclock/>
lib_ignore = NimBLE-Arduino
build_flags =
    ${env:waveshare_lcd7b.build_flags}
    -Isrc/hamclock

[env:waveshare_lcd35]
build_flags =
    ${env.build_flags}
    ${usb_cdc.build_flags}
    -DBOARD_LCD35
    -DLCD_SPI_HZ=40000000
    ; 1 o 3: si la imagen y el tactil salen girados 180 grados, probar 3
    -DLCD35_ROTATION=1

[env:waveshare_lcd28b]
build_flags =
    ${env.build_flags}
    ${usb_cdc.build_flags}
    -DBOARD_LCD28B
    -DLCD_PCLK_HZ=18000000

[env:waveshare_lcd169]
build_flags =
    ${env.build_flags}
    ${usb_cdc.build_flags}
    -DBOARD_LCD169
    -DLCD_SPI_HZ=40000000

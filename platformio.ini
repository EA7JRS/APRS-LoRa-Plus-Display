; APRS LoRa+ Display - Waveshare ESP32-S3-Touch-LCD-7B (1024x600)
; Copyright (C) 2026 Manuel - EA7JRS - GPL-3.0-or-later
[platformio]
default_envs = waveshare_lcd7b

[env:waveshare_lcd7b]
; pioarduino: Arduino-ESP32 3.x (ESP-IDF 5.x), necesario para esp_lcd RGB con bounce buffer
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
monitor_speed = 115200
lib_deps =
    lvgl/lvgl @ ~8.4.0
    h2zero/NimBLE-Arduino @ ^2.2.0
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -Isrc
    ; LVGL sin lv_conf.h: todo por defecto salvo lo de aqui
    -DLV_CONF_SKIP=1
    -DLV_COLOR_DEPTH=16
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_UNSCII_16=1
    -include src/lv_defs.h
    -DLV_USE_LOG=0
    -DLV_MEM_CUSTOM=1
    -DLV_USE_PERF_MONITOR=0
    ; version
    -DDISPLAY_VERSION=\"5.3.5\"
    ; reloj de pixel del panel (Hz). 30 MHz con memoria PSRAM a 120 MHz; con 80 MHz bajarlo si hay parpadeo
    -DLCD_PCLK_HZ=18000000
